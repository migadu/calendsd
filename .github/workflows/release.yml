name: release

# Pushing a tag like v1.2.3 builds the three binaries for every target below
# and publishes them, with checksums, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pkg=github.com/migadu/calendsd/internal/version
          ldflags="-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.Date=${date}"
          mkdir dist
          for target in linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="calendsd_${version#v}_${os}_${arch}"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "build/${name}/" ./cmd/calendsd ./cmd/calctl ./cmd/calclient
            cp LICENSE README.md config.toml.example "build/${name}/"
            tar -C build -czf "dist/${name}.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
