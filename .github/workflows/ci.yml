name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # The dev Postgres runs first so the storage and migration tests run
      # instead of skipping.
      - name: Unit tests + corpus
        run: nix develop -c sh -c 'scripts/dev-db.sh start && go vet ./... && go test ./...'

      - name: golangci-lint
        run: nix develop -c golangci-lint run ./...

      # litmus is packaged for Linux only; results are informational until
      # the WebDAV class coverage is reviewed and pinned.
      - name: litmus WebDAV suite (informational)
        continue-on-error: true
        run: |
          nix develop -c sh -c '
            set -e
            go run ./cmd/calendsd -addr :8085 &
            SERVER=$!
            sleep 1
            litmus http://127.0.0.1:8085/ | tee litmus.log || true
            kill $SERVER
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litmus-results
          path: litmus.log
          if-no-files-found: ignore

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The calclient web apps' unit tests (node --test) and eslint. The apps
  # have no build step; npm only fetches eslint.
  calclient:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/calclient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
