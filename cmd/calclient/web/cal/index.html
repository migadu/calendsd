<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/cal/cal.css">
</head>
<body>
<div id="login" hidden>
  <form id="login-form">
    <h1>Calendar</h1>
    <p class="sub">Sign in to your calendar &amp; contacts</p>
    <label>Username <input id="login-user" autocomplete="username" required></label>
    <label>Password <input id="login-pass" type="password" autocomplete="current-password" required></label>
    <label class="row"><input type="checkbox" id="login-stay"> Stay signed in on this device</label>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<header id="topbar" hidden>
  <button id="menu-toggle" class="icon-btn" aria-label="Show calendars" aria-expanded="false"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span id="brand">Calendar</span>
  <nav id="mainnav">
    <a href="/cal/calendar" data-nav="calendar" class="active">Calendar</a>
    <a href="/cal/tasks" data-nav="tasks">Tasks</a>
    <a href="/cal/contacts" data-nav="contacts">Contacts</a>
  </nav>
  <div id="cal-controls">
    <button id="nav-today" title="Go to today">Today</button>
    <button id="nav-prev" class="icon-btn" title="Previous" aria-label="Previous"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button id="nav-next" class="icon-btn" title="Next" aria-label="Next"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <span id="cal-title" aria-live="polite"></span>
    <span id="view-seg" role="group" aria-label="View">
      <button data-view="day">Day</button>
      <button data-view="week">Week</button>
      <button data-view="month">Month</button>
      <button data-view="agenda">Agenda</button>
    </span>
  </div>
  <button id="bell" title="Invitations" aria-label="Invitations"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 4.2 1.5 5.5 2 6H4c.5-.5 2-1.8 2-6Z"/><path d="M10.3 18.5a1.8 1.8 0 0 0 3.4 0"/></svg><span id="bell-badge" hidden></span></button>
  <div id="usermenu">
    <button id="user-btn" aria-haspopup="true" aria-expanded="false">
      <span id="whoami"></span><span class="caret" aria-hidden="true"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
    <div id="user-pop" role="menu" hidden>
      <a href="/cal/settings" data-nav="settings" role="menuitem">Settings</a>
      <button id="signout" role="menuitem">Sign out</button>
    </div>
  </div>
</header>

<div id="scrim"></div>

<div id="layout" hidden>
  <aside id="sidebar">
    <button id="new-event" class="primary"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New event</button>
    <h2>My calendars</h2>
    <ul id="cal-list"></ul>
    <button id="new-calendar" class="ghost"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New calendar</button>
  </aside>
  <main id="content" tabindex="-1"></main>
</div>

<aside id="invites-panel" role="dialog" aria-label="Invitations" tabindex="-1" hidden>
  <div class="panel-head"><h2>Invitations</h2><button id="invites-close" class="icon-btn" aria-label="Close"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="invites-list"></div>
</aside>

<div id="dialog-host"></div>
<div id="toast" hidden></div>

<script type="module" src="/cal/js/main.js"></script>
</body>
</html>
